# ===== MCPCommand 工程配置 =====

# ---- Gradle 运行参数 ----
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ===== Fabric Properties =====
# 版本与原始 jar 的 MANIFEST 构建信息保持一致（不要跟着官方模板升级，否则产物与线上 jar 不可比）
# 原始 jar: Minecraft 1.21.11 / fabric-loader 0.18.4 / Loom 1.17.14 / Gradle 9.5.1 / Java >=21
minecraft_version=1.21.11
loader_version=0.18.4
loom_version=1.17.14

# ===== Dependencies =====
# fabric-api：原始 fabric.mod.json 只声明 "*"；这里填与 1.21.11 对应的最新版
fabric_version=0.141.6+1.21.11
# yarn 映射（仅在 use_yarn=true 时使用）
yarn_mappings=1.21.11+build.6

# ---- 映射选择（重要）----
# 本工程源码是「生产 jar 反编译」得到的，类名/方法名是 intermediary（class_XXXX / method_XXXX）。
#   use_yarn=false → 使用现场生成的「named = intermediary」三命名空间映射，源码可直接编译（默认）
#                    （生成逻辑见 gradle/intermediary-as-named-mappings.gradle，原因见 docs/ARCHITECTURE.md 的「构建系统」）
#   use_yarn=true  → 依赖 yarn 映射，但必须先把源码里的 intermediary 名改成 yarn 名
#                    （迁移步骤见 docs/ARCHITECTURE.md 的「构建系统」）
use_yarn=false

# ===== Mod Properties =====
# 会写入 fabric.mod.json / 产物名
mod_version=1.0.0
maven_group=laoqi.mcpcommand
archives_base_name=mcpcommand

# ---- 镜像相关备注 ----
# 依赖仓库镜像在 settings.gradle / build.gradle 中配置（官方 Fabric 源优先 + 阿里云公共库）。
# 注意：fabric-loom 把「Minecraft 资源文件」（resources.download.minecraft.net）与版本清单地址
#       写死在代码里，无法仅靠 gradle.properties 重定向；如需加速，见 docs/ARCHITECTURE.md 的
#       「首次构建加速」一节（预置 ~/.gradle/caches/fabric-loom 缓存）。
