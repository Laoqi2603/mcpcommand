# 自动构建：每次 push / PR 都跑一遍，帮助发现只在特定平台或 JDK 上出现的问题，
# 也是防止坏提交进入主干的第一道防线。
#
# 与 Fabric 官方模板的唯一差异：模板用 JDK 25，这里用 21 ——
# 本工程 options.release = 21、原始 jar 由 Java 21 编译，本地验证环境也是 JDK 21.0.11；
# 用 21 可以避免 Gradle 9.5.1 跑在更高版本 JDK 上的兼容性风险。要升请先在本地验证。

name: build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']        # 打 tag 走 release.yml，避免重复构建
  pull_request:
  workflow_dispatch:

# 最小权限：这个工作流只需要读代码
permissions:
  contents: read

# 同一分支的旧任务自动取消，省 CI 额度
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      # 缓存 Gradle 依赖：首次构建要下载 Minecraft 与全部依赖，之后能快很多
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
